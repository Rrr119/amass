# ─────────────────────────────────────────────────────────────────────────
# seed: where the enumeration STARTS — the existing knowledge about the
# target (its domains, known names, address space, or company). The seed is
# the one section you really need: everything listed here is collected from,
# and is automatically in scope.
#
# Any seed entry is also a scope entry, so a simple run needs only a seed.
# Use a separate scope section (below) only when the boundary should be
# wider than the starting points.
# ─────────────────────────────────────────────────────────────────────────
#seed:
#  domains: # registered domains to begin from (the usual starting point)
#    - owasp.org
#  names: # known DNS names (leads) so the run does not overlook them;
#    - vpn.owasp.org   # normally subdomains of a domain already in scope.
#    - api.owasp.org   # Each lead's registered domain is added to the scope.
#  names_file: ./known-names.txt # a file of leads, one name per line
#                                # (e.g. output from other tooling)
#  ips: # IP addresses to begin from (several formats are accepted)
#    - 192.0.2.1
#    - 192.0.2.2
#    - 192.168.0.3-8
#    - 192.168.0.10-192.168.0.20
#  cidrs: # CIDR ranges to begin from
#    - 192.0.2.0/24
#    - 192.0.2.128/25
#  asns: # autonomous system numbers to begin from
#    - 64496
#  organizations: # company names to begin from; the engine resolves each to
#    - Example Corporation   # its registered domains, networks and systems.
#  phones: # phone numbers to begin from; each resolves to the organizations
#    - +1-555-0100           # tied to the number (seed only)
#  street_addresses: # street addresses to begin from; each resolves to the
#    - 1 Main St, Anytown, CA 94000   # organizations at the address (seed only)

# ─────────────────────────────────────────────────────────────────────────
# scope: the BOUNDARY a discovered asset must fall within to be kept. Unless
# the run is started with -rigid, the engine may widen the scope as it finds
# evidence (for example, a netblock or domain registered to an in-scope
# organization) — so the scope is a starting boundary, not a hard cap.
#
# Leave scope out to bound the run by the seed alone. List entries here only
# to allow assets beyond the seed. The same entry types as the seed are
# accepted (names and names_file are seed-only), plus ports and blacklist.
# ─────────────────────────────────────────────────────────────────────────
scope:
#  domains: # additional registered domains allowed in scope
#    - owasp.org
#  ips: # IP addresses allowed in scope
#    - 192.0.2.1
#  cidrs: # CIDR ranges allowed in scope
#    - 192.0.2.0/24
#  asns: # autonomous systems allowed in scope (their announced networks)
#    - 64496
#  organizations: # companies discovered assets must be attributable to
#    - Example Corporation
  # Ports active enumeration may probe on in-scope addresses, for every
  # service. Leave ports out to probe every port the probes know (the SSH,
  # mail and file greetings, and the common web and management-API ports).
  # List ports only to narrow that; ranges such as "8000-8010" also work.
  ports:
    - 80
    - 443
    - 8000
    - 8080
    - 8443
    - 8888
#  blacklist: # subdomains that will never be investigated
#    - internal.owasp.org
options:
  datasources: "./datasources.yaml"
  # engine: "http://127.0.0.1:4000"
  # database: "bolt://neo4j:amass4OWASP@neo4j:7687/neo4j"
  # database: "postgres://amass:amass4OWASP@assetdb:5432/assetdb"
  bruteforce:
    enabled: false
    wordlists: # wordlist(s) to use that are specific to brute forcing
      - "./wordlists/short-wordlist.txt"
      #- "./wordlists/subdomains-top1mil-5000.txt"
      #- "./wordlists/subdomains-top1mil-20000.txt"
      #- "./wordlists/subdomains-top1mil-110000.txt"
  alterations:
    enabled: false
    wordlists: # wordlist(s) to use that are specific to name alterations
      - "./wordlists/alterations.txt"
  default_transform_values:
    ttl: 1440 # minutes. If not specified, the default is 1440 minutes (1 day)
    confidence: 50 # 50%
    priority: 5
  # ai: optional model settings for `amass ai` and the MCP server. Nothing
  # here turns AI on by itself; enumeration needs no model.
  # ai:
  #   provider: ollama
  #   endpoint: http://127.0.0.1:11434
  #   model: qwen3:8b
  #
  #   # documents: the ONE model allowed to read collected documents (PDFs
  #   # and Office files), all of each one's text, to find what they state:
  #   # the hosts, networks, organizations, people, products and addresses
  #   # they name, how these relate, and their details. Documents are fetched
  #   # again to be read; the database keeps no copy, and each version is read
  #   # once. Documents can hold personal or internal details, so this model is
  #   # named on its own and never falls back to the model above; without it,
  #   # no model reads documents. Uncomment ONE of the three provider choices.
  #   documents:
  #     enabled: true
  #     # 1) The containerized Ollama started by this Compose project:
  #     provider: ollama
  #     endpoint: http://ollama:11434
  #     model: qwen3:8b
  #     allow_http: true    # trusted private Compose network ONLY
  #     # 2) An Ollama running directly on the host machine (bare metal):
  #     # provider: ollama
  #     # endpoint: http://host.docker.internal:11434   # from a container
  #     # endpoint: http://127.0.0.1:11434              # outside a container
  #     # model: qwen3:8b
  #     # allow_http: true
  #     # 3) Another provider or model, if you are comfortable sending document
  #     #    documents to it (the key is read from the named variable, never
  #     #    written here):
  #     # provider: anthropic           # or compatible (OpenAI-compatible API)
  #     # model: claude-sonnet-5-5
  #     # api_key_env: ANTHROPIC_API_KEY
  #     # endpoint: https://api.anthropic.com/v1/messages
  #     model_timeout: 4m
  #     # Other models (the investigation model above, MCP clients) see only
  #     # counts of the findings unless this is true:
  #     share_with_assistants: false
  #     # Leads the document model may hand one enumeration: 0 adapts to how
  #     # many the engine confirms and to the run's size; a number caps it;
  #     # -1 submits none (findings are still stored):
  #     max_leads: 0
  #     # How long a finished enumeration stays open while documents are
  #     # still being read, so their leads reach it (0 = not at all). It ends
  #     # sooner once the documents left could not be read in time; the next
  #     # run reads them:
  #     hold: 15m
  #     # The longest one reading spends on one document (0 = no limit); the
  #     # rest of a long document is read by the next reading:
  #     document_timeout: 10m
  #     # The most parts of one document one reading takes (0 = no cap),
  #     # mainly to bound what a hosted model costs:
  #     max_chunks: 0

transformations:
  Account->ALL:
    ttl: 10800 # 7 days
  AutnumRecord->ALL:
  AutonomousSystem->ALL:
  AutonomousSystem->RDAP:
    ttl: 43200 # 30 days
  ContactRecord->ALL:
  DomainRecord->ALL:
  File->ALL:
  FQDN->ALL:
  FQDN->DomainRecord:
    ttl: 43200 # 30 days
  FundsTransfer->ALL:
    ttl: 10800 # 7 days
  GeoLocation->ALL:
  Identifier->ALL:
  Identifier->GLEIF:
    ttl: 43200 # 30 days
  Identifier->RDAP:
    ttl: 43200 # 30 days
  IPAddress->ALL:
  IPNetRecord->ALL:
  Netblock->ALL:
  Netblock->RDAP:
    ttl: 43200 # 30 days
  Organization->ALL:
  Organization->GLEIF:
    ttl: 43200 # 30 days
  Person->ALL:
    ttl: 43200 # 30 days
  Phone->ALL:
    ttl: 10800 # 7 days
  Product->ALL:
    ttl: 10800 # 7 days
  ProductRelease->ALL:
  Service->ALL:
  StreetAddress->ALL:
  TLSCertificate->ALL:
    ttl: 10800 # 7 days
  URL->ALL:
  URL->File:
    ttl: 43200 # 30 days: a stored document is not fetched again within it
